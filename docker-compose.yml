version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synchtasks-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: synchtasks-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-vue:/app

  mongo:
    image: mongo:latest
    container_name: synchtasks-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: 