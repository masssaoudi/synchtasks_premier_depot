# ============================================================================
# DOCKER COMPOSE DÉFINITIF SYNCHTASKS - PRODUCTION READY
# ============================================================================

version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:latest
    container_name: synchtasks-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: synchtasks2025
      MONGO_INITDB_DATABASE: synchtasks_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - synchtasks-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application SyncTasks
  synchtasks-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synchtasks-api
    restart: unless-stopped
    environment:
      # Base de données
      MONGODB_URL: mongodb://admin:synchtasks2025@mongodb:27017/synchtasks_db?authSource=admin
      DATABASE_NAME: synchtasks_db
      
      # Configuration de l'application
      APP_NAME: SyncTasks
      APP_VERSION: 1.0.0
      DEBUG: "false"
      
      # Sécurité
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # IA Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # WebSockets
      DISABLE_WEBSOCKETS: "false"
      
      # Tests
      RUN_TESTS: "false"
      USE_MOCK_DB: "false"
      
      # Logs
      LOG_LEVEL: INFO
      
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - synchtasks-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Interface utilisateur (optionnel - pour développement)
  synchtasks-ui:
    image: nginx:alpine
    container_name: synchtasks-ui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ui:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - synchtasks-api
    networks:
      - synchtasks-network
    profiles:
      - ui

  # Redis pour le cache (optionnel)
  redis:
    image: redis:alpine
    container_name: synchtasks-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - synchtasks-network
    profiles:
      - cache

# Volumes persistants
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# Réseau personnalisé
networks:
  synchtasks-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 