version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synchtasks-backend
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017/synchtasks_db
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - synchtasks-network

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: synchtasks-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - synchtasks-network

  mongo:
    image: mongo:7.0
    container_name: synchtasks-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=synchtasks_db
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - synchtasks-network

  # Service optionnel pour MongoDB Express (interface web)
  mongo-express:
    image: mongo-express:latest
    container_name: synchtasks-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - synchtasks-network

volumes:
  mongo_data:

networks:
  synchtasks-network:
    driver: bridge 